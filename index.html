<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dumb Clanker</title>
  </head>
  <body>
    <div id="app">
      <canvas id="screen"></canvas>
      <div id="matchbar">
        <button id="recall" title="Teleport your bot to a clear spot and restart its script">
          Recall bot <kbd>C</kbd>
        </button>
        <button id="rerun" title="Run the same battle again from the start">Run again <kbd>R</kbd></button>
        <button id="toworkshop" title="Back to the script editor">Workshop <kbd>B</kbd></button>
      </div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
